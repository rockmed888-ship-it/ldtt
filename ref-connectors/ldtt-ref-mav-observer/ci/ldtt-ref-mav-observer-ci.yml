# LDTT Phase 2 draft — ref Observe connector CI (free GitHub Actions, $0).
# Lives at repo root (GitHub only runs root .github/workflows). Connector path below.
# Jobs: tests + schema + N3 evidence gate; reproducible wheel + digest check vs ldtt.yaml;
# keyless cosign sign + GitHub SLSA build provenance (E3 / C3) on main; real ArduCopter SITL smoke (E8).
name: ldtt-ref-mav-observer-ci

on:
  push:
    branches: [main, "phase-2/**"]
    paths: ["ref-connectors/ldtt-ref-mav-observer/**", "schema/**", ".github/workflows/ldtt-ref-mav-observer-ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONNECTOR: ref-connectors/ldtt-ref-mav-observer

defaults:
  run:
    working-directory: ref-connectors/ldtt-ref-mav-observer

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LDTT_DEV: ""   # N3: never dev mode in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Unit tests (incl. N3 dev-flag gate)
        run: pytest -q
      - name: Validate ldtt.yaml vs schema/ldtt.schema.json
        run: python scripts/validate_ldtt_yaml.py
      - name: N3 — evidence must not rely on --skip-revoke / --no-interval-check
        run: python scripts/check_evidence_no_dev_flags.py
      - name: Local-key verify published revocation list + stamp (in-process, A1)
        run: |
          python - <<'PY'
          from pathlib import Path
          from ldtt_ref_mav_observer.cosign_verify import verify_blob
          key = Path("placeholders/keys/ldtt-placeholder.pub")
          for b in ["placeholders/revocations/revocations.json",
                    "placeholders/stamps/org.ldtt.ref-mav-observer/0.1.0.json"]:
              r = verify_blob(Path(b), bundle_path=Path(b + ".sigstore.json"), key_path=key)
              print(b, r.mode, r.ok); assert r.ok, r.detail
          PY

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Fulcio OIDC (keyless) + attestations
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -U pip build pyyaml
      - name: Reproducible wheel (SOURCE_DATE_EPOCH pinned)
        run: PYTHON=python scripts/build_release.sh
      - name: Digest must equal ldtt.yaml build.artifact_digest (local build == CI build)
        run: |
          want=$(python -c "import yaml;print(yaml.safe_load(open('ldtt.yaml'))['build']['artifact_digest'])")
          got="sha256:$(cut -d' ' -f1 dist/SHA256SUMS)"
          echo "ldtt.yaml: $want"; echo "CI build : $got"
          test "$want" = "$got"
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Keyless cosign sign wheel (Fulcio + Rekor)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl)
          cosign sign-blob --yes --bundle dist/ldtt-ref-mav-observer.keyless.sigstore.json "$WHL"
          cosign verify-blob --bundle dist/ldtt-ref-mav-observer.keyless.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ldtt-ref-mav-observer-ci.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$WHL"
      - name: SLSA build provenance (GitHub attestation, in-toto, Sigstore-signed)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.CONNECTOR }}/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ldtt-ref-mav-observer-release
          path: |
            ${{ env.CONNECTOR }}/dist/*.whl
            ${{ env.CONNECTOR }}/dist/SHA256SUMS
            ${{ env.CONNECTOR }}/dist/*.sigstore.json

  real-sitl-smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      LDTT_DEV: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Real ArduCopter SITL smoke (E8) — no dev-only flags (N3)
        run: python scripts/real_sitl_smoke.py --backend official --evidence-dir /tmp/e8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e8-real-sitl-evidence
          path: /tmp/e8/
