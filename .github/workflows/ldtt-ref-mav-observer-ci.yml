# P5 — ref Observe connector CI. Keyless sign and SLSA attestation run only on main.
# Identity: https://github.com/rockmed888-ship-it/ldtt/.github/workflows/ldtt-ref-mav-observer-ci.yml@refs/heads/main
name: ldtt-ref-mav-observer-ci

on:
  push:
    branches: [main]
    paths:
      - "ref-connectors/ldtt-ref-mav-observer/**"
      - "schema/**"
      - ".github/workflows/ldtt-ref-mav-observer-ci.yml"
  pull_request:
    paths:
      - "ref-connectors/ldtt-ref-mav-observer/**"
      - "schema/**"
      - ".github/workflows/ldtt-ref-mav-observer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONNECTOR: ref-connectors/ldtt-ref-mav-observer
  SIGNER_IDENTITY: https://github.com/rockmed888-ship-it/ldtt/.github/workflows/ldtt-ref-mav-observer-ci.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

defaults:
  run:
    working-directory: ref-connectors/ldtt-ref-mav-observer

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LDTT_DEV: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Unit tests (incl. N3 dev-flag gate)
        run: pytest -q
      - name: Validate ldtt.yaml vs schema/ldtt.schema.json
        run: python scripts/validate_ldtt_yaml.py
      - name: N3 — evidence must not rely on dev-only flags
        run: python scripts/check_evidence_no_dev_flags.py
      - name: Local-key verify published placeholder list + stamp (draft only)
        run: |
          python - <<'PY'
          from pathlib import Path
          from ldtt_ref_mav_observer.cosign_verify import verify_blob
          key = Path("placeholders/keys/ldtt-placeholder.pub")
          for blob in ["placeholders/revocations/revocations.json",
                       "placeholders/stamps/org.ldtt.ref-mav-observer/0.1.0.json"]:
              result = verify_blob(Path(blob), bundle_path=Path(blob + ".sigstore.json"), key_path=key)
              print(blob, result.mode, result.ok)
              assert result.ok, result.detail
          PY

  release-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip build pyyaml
      - name: Reproducible wheel
        run: PYTHON=python scripts/build_release.sh
      - name: Digest must equal ldtt.yaml build.artifact_digest
        run: |
          want=$(python -c "import yaml;print(yaml.safe_load(open('ldtt.yaml'))['build']['artifact_digest'])")
          got="sha256:$(cut -d' ' -f1 dist/SHA256SUMS)"
          echo "ldtt.yaml: $want"
          echo "CI build : $got"
          test "$want" = "$got"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ldtt-ref-mav-observer-wheel
          path: |
            ref-connectors/ldtt-ref-mav-observer/dist/*.whl
            ref-connectors/ldtt-ref-mav-observer/dist/SHA256SUMS

  release-sign:
    needs: release-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip build pyyaml
      - name: Rebuild wheel and re-check digest
        run: |
          PYTHON=python scripts/build_release.sh
          want=$(python -c "import yaml;print(yaml.safe_load(open('ldtt.yaml'))['build']['artifact_digest'])")
          got="sha256:$(cut -d' ' -f1 dist/SHA256SUMS)"
          echo "ldtt.yaml: $want"
          echo "CI build : $got"
          test "$want" = "$got"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Keyless sign the wheel and verify the pinned identity
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl)
          cosign sign-blob --yes --bundle dist/ldtt-ref-mav-observer.keyless.sigstore.json "$WHL"
          cosign verify-blob \
            --bundle dist/ldtt-ref-mav-observer.keyless.sigstore.json \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$WHL"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ref-connectors/ldtt-ref-mav-observer/dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ldtt-ref-mav-observer-release
          path: |
            ref-connectors/ldtt-ref-mav-observer/dist/*.whl
            ref-connectors/ldtt-ref-mav-observer/dist/SHA256SUMS
            ref-connectors/ldtt-ref-mav-observer/dist/*.sigstore.json

  real-sitl-smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      LDTT_DEV: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Real ArduCopter SITL smoke (E8)
        run: python scripts/real_sitl_smoke.py --backend official --evidence-dir /tmp/e8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e8-real-sitl-evidence
          path: /tmp/e8/
